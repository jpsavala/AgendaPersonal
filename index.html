<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Personal</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- PWA: instalable en Android/Chrome y iOS/Safari (ver manifest.json y js/palettes.js, que actualiza theme-color en vivo según la paleta elegida). -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1b4332" id="theme-color-meta" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agenda" />
</head>
<body>
  <header class="app-header">
    <div class="masthead">
      <span class="masthead-badge" id="masthead-badge">JP</span>
      <span class="masthead-name" id="masthead-name">Juan Pablo Savala</span>
      <span class="sync-status" id="sync-status" title="Estado de sincronización entre dispositivos"></span>
      <button class="settings-btn" id="settings-btn" title="Configuración">⚙️</button>
    </div>
    <nav class="tabs">
      <button class="tab-button active" data-tab="diaria">Diaria</button>
      <button class="tab-button" data-tab="semanal">Semanal</button>
      <button class="tab-button" data-tab="mensual">Mensual</button>
      <button class="tab-button" data-tab="comidas">Comidas</button>
      <button class="tab-button" data-tab="anio">Año</button>
    </nav>
  </header>

  <main>
    <div id="view-container"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/wordOfTheDay.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/scheduleDefs.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/userConfig.js"></script>
  <script src="js/trainingSchedule.js"></script>
  <script src="js/userGoal.js"></script>
  <script src="js/scheduleQueue.js"></script>
  <script src="js/state.js"></script>
  <script src="js/aiBridge.js"></script>
  <script src="js/dailyView.js"></script>
  <script src="js/weeklyView.js"></script>
  <script src="js/monthlyView.js"></script>
  <script src="js/mealsView.js"></script>
  <script src="js/yearView.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebaseSync.js"></script>
  <script src="js/userConfigSync.js"></script>
  <script>
    (function () {
      const el = document.getElementById("sync-status");
      const labels = {
        connecting: "Conectando…",
        syncing: "Sincronizando…",
        synced: "Sincronizado",
        error: "Sin conexión con el servidor",
        "signed-out": "Iniciar sesión para sincronizar",
      };
      function render(status) {
        el.textContent = labels[status] || "";
        el.className = "sync-status " + status;
      }
      const sync = window.Agenda.firebaseSync;
      sync.onStatusChange(render);
      render(sync.getStatus());
      el.addEventListener("click", () => {
        if (sync.getUserEmail()) {
          if (confirm("¿Cerrar sesión de " + sync.getUserEmail() + "?")) sync.signOut();
        } else {
          sync.openLogin();
        }
      });

      document.getElementById("settings-btn").addEventListener("click", () => {
        window.Agenda.userConfigSync.openSettings();
      });
    })();
  </script>

  <script>
    // PWA: registra el service worker (ver service-worker.js) y avisa
    // cuando una versión nueva ya está en control pero esta pestaña
    // sigue mostrando la vieja (recién ahí conviene recargar). En la
    // primera instalación (sin service worker previo) no hay nada
    // "viejo" que avisar, así que no muestra nada la primera vez.
    (function () {
      if (!("serviceWorker" in navigator)) return;

      function showUpdateBanner() {
        if (document.getElementById("update-banner")) return;
        const banner = document.createElement("div");
        banner.id = "update-banner";
        banner.className = "update-banner";
        banner.textContent = "Hay una actualización disponible — toca para recargar";
        banner.addEventListener("click", () => window.location.reload());
        document.body.appendChild(banner);
      }

      window.addEventListener("load", () => {
        const hadControllerAlready = !!navigator.serviceWorker.controller;
        navigator.serviceWorker
          .register("service-worker.js")
          .catch((err) => console.error("No se pudo registrar el service worker:", err));
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (hadControllerAlready) showUpdateBanner();
        });
      });
    })();
  </script>
</body>
</html>
