<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Personal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="masthead">
      <span class="masthead-badge">JP</span>
      <span class="masthead-name">Juan Pablo Savala</span>
      <span class="sync-status" id="sync-status" title="Estado de sincronización entre dispositivos"></span>
    </div>
    <nav class="tabs">
      <button class="tab-button active" data-tab="diaria">Diaria</button>
      <button class="tab-button" data-tab="semanal">Semanal</button>
      <button class="tab-button" data-tab="mensual">Mensual</button>
      <button class="tab-button" data-tab="comidas">Comidas</button>
      <button class="tab-button" data-tab="anio">Año</button>
    </nav>
  </header>

  <main>
    <div id="view-container"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/wordOfTheDay.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/scheduleDefs.js"></script>
  <script src="js/trainingSchedule.js"></script>
  <script src="js/scheduleQueue.js"></script>
  <script src="js/state.js"></script>
  <script src="js/aiBridge.js"></script>
  <script src="js/dailyView.js"></script>
  <script src="js/weeklyView.js"></script>
  <script src="js/monthlyView.js"></script>
  <script src="js/mealsView.js"></script>
  <script src="js/yearView.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebaseSync.js"></script>
  <script>
    (function () {
      const el = document.getElementById("sync-status");
      const labels = {
        connecting: "Conectando…",
        syncing: "Sincronizando…",
        synced: "Sincronizado",
        error: "Sin conexión con el servidor",
        "signed-out": "Iniciar sesión para sincronizar",
      };
      function render(status) {
        el.textContent = labels[status] || "";
        el.className = "sync-status " + status;
      }
      const sync = window.Agenda.firebaseSync;
      sync.onStatusChange(render);
      render(sync.getStatus());
      el.addEventListener("click", () => {
        if (sync.getUserEmail()) {
          if (confirm("¿Cerrar sesión de " + sync.getUserEmail() + "?")) sync.signOut();
        } else {
          sync.openLogin();
        }
      });
    })();
  </script>
</body>
</html>
