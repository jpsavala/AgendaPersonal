<body>
  <header class="app-header">

      <span class="masthead-badge" id="masthead-badge">JP</span>

      <button class="tab-button" data-tab="comidas">Comidas</button>

  <main>
    <div id="view-container"></div>

  <!-- Navegación inferior (hasta 768px de ancho, ver css/styles.css):
       mismos botones que nav.tabs de arriba (misma clase tab-button +
       data-tab, así que js/app.js los sincroniza sin código aparte) más
       el acceso a Configuración, que en mobile se muda acá. -->
  <nav class="bottom-nav" aria-label="Navegación">
    <div class="bottom-nav-inner">
      <button class="tab-button bottom-nav-item active" data-tab="diaria">
        <span class="bottom-nav-icon">📝</span>
        <span class="bottom-nav-label">Diaria</span>
      </button>
      <button class="tab-button bottom-nav-item" data-tab="semanal">
        <span class="bottom-nav-icon">📅</span>
        <span class="bottom-nav-label">Semanal</span>
      </button>
      <button class="tab-button bottom-nav-item" data-tab="mensual">
        <span class="bottom-nav-icon">🗓️</span>
        <span class="bottom-nav-label">Mensual</span>
      </button>
      <button class="tab-button bottom-nav-item" data-tab="comidas">
        <span class="bottom-nav-icon">🍽️</span>
        <span class="bottom-nav-label">Comidas</span>
      </button>
      <button class="tab-button bottom-nav-item" data-tab="gimnasio">
        <span class="bottom-nav-icon">🏋️</span>
        <span class="bottom-nav-label">Gimnasio</span>
      </button>
      <button class="tab-button bottom-nav-item" data-tab="anio">
        <span class="bottom-nav-icon">🗂️</span>
        <span class="bottom-nav-label">Año</span>
      </button>
      <button class="bottom-nav-item" id="settings-btn-mobile">
        <span class="bottom-nav-icon">⚙️</span>
        <span class="bottom-nav-label">Ajustes</span>
      </button>
    </div>
  </nav>

  <!-- Captura rápida (botón flotante "+", ver js/quickCapture.js): un
       solo campo de texto, Enter o "Guardar" anota en la Bandeja de
       entrada (ver js/state.js: addInboxItem), visible desde cualquier
       pestaña. -->
  <button id="quick-capture-fab" class="fab" title="Captura rápida" aria-label="Anotar un pendiente rápido">+</button>
  <div id="quick-capture-overlay" class="quick-capture-overlay">
    <div id="quick-capture-sheet" class="quick-capture-sheet">
      <input id="quick-capture-input" type="text" class="add-input" placeholder="¿Qué necesitas anotar?" />
      <div class="quick-capture-actions">
        <button id="quick-capture-cancel" class="btn-secondary" type="button">Cancelar</button>
        <button id="quick-capture-save" class="btn-primary" type="button">Guardar</button>
      </div>
    </div>
  </div>
  <div id="quick-capture-toast" class="quick-capture-toast" role="status">Anotado</div>

  <script src="js/quickCapture.js"></script>
  <script src="js/firebaseSync.js"></script>
  <script src="js/userConfigSync.js"></script>
  <script>
    (function () {
      const el = document.getElementById("sync-status");
      // "error" cubre varias causas (SDK que no cargó, red caída, la
      // primera lectura a Firestore que no respondió, etc.): en TODAS,
      // la agenda sigue funcionando con los datos locales y editable sin
      // problema, así que el mensaje lo deja claro en vez de sonar a que
      // algo se rompió.
      const labels = {
        connecting: "Conectando…",
        syncing: "Sincronizando…",
        synced: "Sincronizado",
        error: "Sin conexión, datos locales",
        "signed-out": "Iniciar sesión para sincronizar",
      };
      function render(status) {
        el.textContent = labels[status] || "";
        el.className = "sync-status " + status;
      }
      const sync = window.Agenda.firebaseSync;
      sync.onStatusChange(render);
      render(sync.getStatus());
      el.addEventListener("click", () => {
        if (sync.getUserEmail()) {
          if (confirm("¿Cerrar sesión de " + sync.getUserEmail() + "?")) sync.signOut();
        } else {
          sync.openLogin();
        }
      });

      document.getElementById("settings-btn").addEventListener("click", () => {
        window.Agenda.userConfigSync.openSettings();
      });
      // Mismo botón de Configuración, pero el de la barra inferior
      // (solo visible hasta 768px, ver css/styles.css).
      const settingsBtnMobile = document.getElementById("settings-btn-mobile");
      if (settingsBtnMobile) {
        settingsBtnMobile.addEventListener("click", () => {
          window.Agenda.userConfigSync.openSettings();
        });
      }

      // Si a los 5 s de abrir la app la sincronización sigue sin
      // resolverse ("connecting" nunca llegó a "synced"/"signed-out"/
      // "error"), o si directamente falló, ofrece un botón para
      // reintentar en vez de dejar solo el indicador chico de arriba —
      // la agenda en sí ya se ve y se puede usar con los datos locales
      // desde el primer instante (ver js/app.js, no espera a esto), así
      // que esto es solo sobre la conexión con el servidor, nunca una
      // pantalla de carga que tape la app.
      let retryBannerShown = false;
      function showRetryBanner() {
        if (retryBannerShown || document.getElementById("connection-retry-banner")) return;
        retryBannerShown = true;
        const banner = document.createElement("div");
        banner.id = "connection-retry-banner";
        banner.className = "connection-retry-banner";
        banner.innerHTML =
          '<span>No se pudo conectar con el servidor. Tus datos locales están disponibles igual.</span>';
        const btn = document.createElement("button");
        btn.className = "btn-secondary";
        btn.textContent = "Reintentar";
        btn.addEventListener("click", () => window.location.reload());
        banner.appendChild(btn);
        document.body.appendChild(banner);
      }
      function hideRetryBanner() {
        retryBannerShown = false;
        const banner = document.getElementById("connection-retry-banner");
        if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
      }
      sync.onStatusChange((status) => {
        if (status === "synced" || status === "signed-out") hideRetryBanner();
        else if (status === "error") showRetryBanner();
      });
      setTimeout(() => {
        const status = sync.getStatus();
        if (status === "connecting" || status === "error") showRetryBanner();
      }, 5000);
    })();
  </script>

  <script>
    // Aviso de que esta agenda se mudó de alojamiento (ver PARTE 1):
    // solo se muestra cuando se abre desde GitHub Pages, nunca en el
    // dominio nuevo de Firebase Hosting ni en desarrollo local. Los
    // datos viven en Firestore por cuenta, no en este dominio, así que
    // es solo un aviso — no hace falta "migrar" nada manualmente, basta
    // con iniciar sesión con la misma cuenta en la URL nueva.
    (function () {
      const NEW_URL = "https://agendapersonal-13aef.web.app/";
      if (!/\.github\.io$/i.test(location.hostname)) return;
      const banner = document.createElement("div");
      banner.className = "hosting-moved-banner";
      banner.innerHTML =
        'Esta agenda se mudó a <a href="' + NEW_URL + '">' + NEW_URL + "</a>";
      document.body.insertBefore(banner, document.body.firstChild);
    })();
  </script>

  <script>
    // Mobile: cuando el teclado en pantalla se abre, el visual viewport
    // (lo que de verdad se ve, sin contar lo tapado por el teclado) se
    // achica bastante respecto al viewport completo — ahí se oculta la
    // barra inferior y el botón "+" para que no tapen el campo que se
    // está escribiendo ni queden flotando a mitad de pantalla (ver
    // body.keyboard-open en css/styles.css).
    (function () {
      if (!window.visualViewport) return;
      function handleViewportResize() {
        const shrunk = window.visualViewport.height < window.innerHeight * 0.75;
        document.body.classList.toggle("keyboard-open", shrunk);
      }
      window.visualViewport.addEventListener("resize", handleViewportResize);
    })();
  </script>

  <script>
    // PWA: registra el service worker (ver service-worker.js) y avisa
    // cuando una versión nueva ya está en control pero esta pestaña
    // sigue mostrando la vieja (recién ahí conviene recargar). En la
    // primera instalación (sin service worker previo) no hay nada
    // "viejo" que avisar, así que no muestra nada la primera vez.
    (function () {
      if (!("serviceWorker" in navigator)) return;

      function showUpdateBanner() {
        if (document.getElementById("update-banner")) return;
        const banner = document.createElement("div");
        banner.id = "update-banner";
        banner.className = "update-banner";
        banner.textContent = "Hay una actualización disponible — toca para recargar";
        banner.addEventListener("click", () => window.location.reload());
        document.body.appendChild(banner);
      }

      window.addEventListener("load", () => {
        const hadControllerAlready = !!navigator.serviceWorker.controller;
        navigator.serviceWorker
          .register("service-worker.js")
          .catch((err) => console.error("No se pudo registrar el service worker:", err));
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (hadControllerAlready) showUpdateBanner();
        });
      });
    })();
  </script>
</body>
